version: "3.9"

services:
  fastapi:
    build:
      context: app
      dockerfile: Dockerfile
    env_file: app/.env
    ports:
      - "${HOST_FASTAPI_PORT}:8000"
    volumes:
      - ./app:/app
    networks:
      - secrets-net

  postgres:
    image: postgres:17
    ports:
      - "${HOST_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - secrets-net

  localstack:
    build:
      context: aws
      dockerfile: Dockerfile
    env_file: aws/.env
    ports:
      - "${HOST_LOCALSTACK_PORT}:4566"
    environment:
      - SERVICES=s3,secretsmanager
      - DEBUG=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - secrets-net

volumes:
  pgdata:

networks:
  secrets-net:
    driver: bridge
